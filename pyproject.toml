[project]
name = "pytorch-uv-template"
version = "0.1.0"
description = "PyTorch project template managed with uv"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

# --- GPU (CUDA) 版 PyTorch を使用する場合の設定例 ---
# uv では特定のインデックスから wheel を取得するように設定できます。
# 例: CUDA 12.6 向けホイールを指定する場合
# [[tool.uv.index]]
# name = "pytorch-cu126"
# url = "https://download.pytorch.org/whl/cu126"
# explicit = true
#
# [tool.uv.sources]
# torch = { index = "pytorch-cu126" }
# torchvision = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# ノートブック内では実験途中の未使用インポートを許容
"*.ipynb" = ["F401"]
